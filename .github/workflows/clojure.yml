name: Clojure checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # These tools are only needed for the local VM lab.
      MISE_DISABLE_TOOLS: jq,ruby,gem:vagrant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and Clojure tools
        id: mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.0'
          # Cache task tools after the checks install only what they use.
          cache_save_post: true

      - name: Lint Clojure
        run: mise run clj:lint

      - name: Check Clojure formatting
        if: ${{ !cancelled() && steps.mise.outcome == 'success' }}
        run: mise run clj:format-check
